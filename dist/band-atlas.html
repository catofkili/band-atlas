<meta charset="utf-8">
<title>乐队关系网</title>
<meta name="description" content="从一支乐队出发，顺着成员、客串、影响与恩怨，走进整张关系网。">
<style>
/* ------------------------------------------------------------------
   乐队关系网 — 深色单主题。
   这是一块夜里的画布，不是文档；配色刻意只做一种世界。
   「重点色」不是一种颜色，而是五种关系类型的功能色，图例即调色板。
------------------------------------------------------------------ */

:root {
  --ground: #0d1014;
  --ground-2: #12161c;
  --panel: #171c24;
  --panel-2: #1d232c;
  --line: #2a323d;
  --line-soft: #212832;
  --ink: #e7e4dc;
  --ink-2: #a7aebb;
  --ink-3: #6c7482;

  --rel-member: #58a6ff;
  --rel-guest: #45c58c;
  --rel-influence: #b98cff;
  --rel-feud: #ff6b5e;
  --rel-scene: #d9ac5a;

  --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK SC",
    "PingFang SC", "Source Han Sans SC", system-ui, sans-serif;
  --display: "Helvetica Neue", "Arial Narrow", "Hiragino Sans", "PingFang SC", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;

  --card-w: min(420px, 84vw);
  --peek-w: min(310px, 66vw);
}

.rel-member { --rel: var(--rel-member); }
.rel-guest { --rel: var(--rel-guest); }
.rel-influence { --rel: var(--rel-influence); }
.rel-feud { --rel: var(--rel-feud); }
.rel-scene { --rel: var(--rel-scene); }

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background:
    radial-gradient(ellipse 70% 60% at 50% 45%, #1a2029 0%, transparent 68%),
    var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; }

/* ------------------------------------------------------------ 舞台与世界 */

.stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

.world {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  will-change: transform;
}

.edges {
  position: absolute;
  overflow: visible;
  pointer-events: none;
}

.edge {
  stroke: var(--rel);
  stroke-width: 1.25;
  opacity: 0.5;
  transition: opacity 0.25s ease, stroke-width 0.25s ease;
}
.edge.is-hot { opacity: 1; stroke-width: 2.25; }
.rel-feud.edge { stroke-dasharray: 7 5; }
.rel-scene.edge { stroke-dasharray: 1.5 5; stroke-linecap: round; }

.node {
  position: absolute;
  --push: 0px;
  --ux: 0;
  --uy: 0;
  transform: translate(-50%, -50%)
    translate(calc(var(--ux) * var(--push)), calc(var(--uy) * var(--push)));
  transition: transform 0.42s cubic-bezier(0.2, 0.9, 0.25, 1), opacity 0.35s ease;
}

.node--focus { z-index: 3; }
.node--peek { z-index: 2; }
.node--chip { z-index: 1; }

/* ---------------------------------------------------------------- 卡片 */

.card {
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 22px 60px -18px rgba(0, 0, 0, 0.85);
}

.card--focus {
  width: var(--card-w);
  padding: 22px 24px 18px;
  display: flex;
  flex-direction: column;
  max-height: min(72vh, 640px);
}

.card__head { flex: none; }

.card__name {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(1.5rem, 4.4vw, 2.05rem);
  letter-spacing: -0.02em;
  line-height: 1.12;
  margin: 0;
  text-wrap: balance;
}

.card__meta {
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  color: var(--ink-3);
  margin: 7px 0 0;
}

.card__body {
  overflow-y: auto;
  overscroll-behavior: contain;
  margin-top: 14px;
  padding-right: 4px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  /* 底部渐隐，提示这里还能往下滚 */
  mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
}
.card__body::-webkit-scrollbar { width: 6px; }
.card__body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.card__intro { margin: 0; color: var(--ink-2); font-size: 0.9rem; }

.card__section { display: flex; flex-direction: column; gap: 8px; }

.card__label {
  font-family: var(--mono);
  font-size: 0.64rem;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line-soft);
}

.taglist {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
}
.tag {
  font-size: 0.7rem;
  letter-spacing: 0.04em;
  color: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 9px;
}
.tag--track { color: var(--ink); border-color: var(--line); background: rgba(255, 255, 255, 0.03); }

.albums { list-style: none; margin: 0; padding: 0; }
.album {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 3px 0;
}
.album__title { flex: 1; font-size: 0.86rem; }
.album__year {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

.lore {
  margin: 0;
  font-size: 0.84rem;
  color: var(--ink-2);
  border-left: 2px solid var(--rel-feud);
  padding-left: 12px;
}

/* 全部关系列表：触屏与超出边缘上限时的主要入口 */
.rels { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }

.rel-row {
  display: flex;
  flex-direction: column;
  gap: 3px;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 8px;
  padding: 7px 9px;
  cursor: pointer;
  transition: background 0.18s ease;
}
.rel-row:hover, .rel-row:focus-visible { background: rgba(255, 255, 255, 0.05); }

.rel-row__top { display: flex; align-items: center; gap: 8px; }
.rel-row__dot {
  width: 7px; height: 7px; flex: none;
  border-radius: 50%;
  background: var(--rel);
}
.rel-row__name { font-size: 0.84rem; font-weight: 600; }
.rel-row__label {
  font-family: var(--mono);
  font-size: 0.66rem;
  color: var(--ink-3);
  margin-left: auto;
  text-align: right;
}
.rel-row__detail { font-size: 0.76rem; color: var(--ink-3); line-height: 1.55; padding-left: 15px; }
.rels__more { margin: 6px 0 0 12px; font-size: 0.72rem; color: var(--ink-3); }

.card__foot {
  flex: none;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--line-soft);
  display: flex;
  align-items: center;
  gap: 12px;
}
.card__counts { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0; }
.count {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 0.64rem;
  color: var(--ink-3);
}
.count__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rel); }
.count--member { --rel: var(--rel-member); }
.count--guest { --rel: var(--rel-guest); }
.count--influence { --rel: var(--rel-influence); }
.count--feud { --rel: var(--rel-feud); }
.count--scene { --rel: var(--rel-scene); }

.card__link {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.04em;
  color: var(--ink-3);
  text-decoration: none;
  white-space: nowrap;
}
.card__link:hover { color: var(--ink); }

/* ------------------------------------------------------------ 边缘卡片 */

.card--peek {
  width: var(--peek-w);
  padding: 14px 16px;
  cursor: pointer;
  display: block;
  text-align: left;
  border-color: color-mix(in srgb, var(--rel) 32%, var(--line));
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.card--peek:hover,
.card--peek:focus-visible {
  border-color: color-mix(in srgb, var(--rel) 70%, var(--line));
  box-shadow: 0 22px 60px -18px rgba(0, 0, 0, 0.9),
    0 0 0 1px color-mix(in srgb, var(--rel) 35%, transparent);
  outline: none;
}

.peek__inner { display: flex; flex-direction: column; gap: 3px; }

.peek__rel {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.16em;
  color: var(--rel);
}
.peek__name {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.02rem;
  letter-spacing: -0.01em;
  line-height: 1.25;
}
.peek__meta { font-family: var(--mono); font-size: 0.63rem; color: var(--ink-3); }

/* 连线上挂不下标签时，关系改写在卡片里 */
.peek__label { display: none; font-size: 0.72rem; color: var(--ink-2); margin-top: 4px; }
.card--peek.show-label .peek__label { display: block; }

/* 露出哪半边，内容就贴哪半边 —— 否则名字正好被切在屏幕外。
   左右方向再把内容宽度压到一半以内，上下方向给卡片一个固定高度，
   这样内容一定落在看得见的那半张卡片里。 */
.card--peek-e .peek__inner { max-width: 58%; margin-right: auto; }
.card--peek-w .peek__inner {
  max-width: 58%;
  margin-left: auto;
  align-items: flex-end;
  text-align: right;
}
.card--peek-n,
.card--peek-s { display: flex; height: 172px; }
.card--peek-n { align-items: flex-end; }
.card--peek-s { align-items: flex-start; }
.card--peek-n .peek__inner,
.card--peek-s .peek__inner { width: 100%; }

.node--peek:hover, .node--peek.is-hot { --push: -26px; }

/* --------------------------------------------------------- 关系标签 */

/* 标签锚在焦点卡片外缘，朝远离卡片的方向生长 */
.node--chip.anchor-e { transform: translate(0, -50%); }
.node--chip.anchor-w { transform: translate(-100%, -50%); }
.node--chip.anchor-s { transform: translate(-50%, 0); }
.node--chip.anchor-n { transform: translate(-50%, -100%); }

.relchip {
  width: max-content;
  max-width: 190px;
  background: color-mix(in srgb, var(--ground) 86%, transparent);
  backdrop-filter: blur(6px);
  border: 1px solid color-mix(in srgb, var(--rel) 34%, var(--line));
  border-radius: 8px;
  padding: 4px 10px;
  transition: border-color 0.25s ease;
}

/* 用行内排版而不是 flex：关系标签写得长了要能自己折行，
   flex 一行到底会把文字顶出盒子，被旁边的卡片切掉。 */
.relchip__head { font-size: 0.72rem; line-height: 1.5; }
.relchip__dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--rel);
  margin-right: 6px;
  vertical-align: middle;
}
.relchip__year {
  margin-left: 6px;
  font-family: var(--mono);
  font-size: 0.63rem;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.relchip__detail {
  display: none;
  clear: both;
  font-size: 0.74rem;
  line-height: 1.55;
  color: var(--ink-2);
  padding-top: 5px;
  margin-top: 5px;
  border-top: 1px solid var(--line-soft);
}
.node--chip.is-hot .relchip {
  border-color: color-mix(in srgb, var(--rel) 75%, var(--line));
}
.node--chip.is-hot .relchip__detail { display: block; }

/* -------------------------------------------------------------- HUD */

.hud {
  position: fixed;
  left: 0;
  right: 0;
  z-index: 10;
  padding: 16px 20px;
  padding-left: max(20px, env(safe-area-inset-left));
  padding-right: max(20px, env(safe-area-inset-right));
  display: flex;
  align-items: center;
  gap: 16px;
  pointer-events: none;
}
.hud > * { pointer-events: auto; position: relative; z-index: 1; }
.hud--top { top: 0; }
.hud--bottom {
  bottom: 0;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
  align-items: flex-end;
}

/* 贴着上下边缘的乐队卡片会滑到 HUD 底下，加一层压暗把 HUD 托住。
   顺带给画面一点边缘的暗角，强化「内容还在屏幕外继续」的感觉。 */
.hud::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 190%;
  pointer-events: none;
}
.hud--top::before { top: 0; background: linear-gradient(to bottom, rgba(9, 11, 14, 0.85), transparent); }
.hud--bottom::before { bottom: 0; background: linear-gradient(to top, rgba(9, 11, 14, 0.85), transparent); }

.wordmark { display: flex; flex-direction: column; line-height: 1.35; margin-right: auto; }
.wordmark__name {
  font-family: var(--display);
  font-weight: 700;
  font-size: 0.92rem;
  letter-spacing: 0.02em;
}
.wordmark__scene { font-family: var(--mono); font-size: 0.63rem; color: var(--ink-3); }

.btn {
  background: color-mix(in srgb, var(--panel) 80%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 16px;
  font-size: 0.78rem;
  cursor: pointer;
  transition: border-color 0.2s ease, color 0.2s ease;
}
.btn:hover, .btn:focus-visible { border-color: var(--ink-3); outline: none; }

/* 图例竖排缩在角落里。横着铺开会占满整条底边，
   而那正是下方那几张乐队卡片露头的地方。 */
/* ------------------------------------------------------------- 搜索 */

/* 做成盖住全屏的浮层，而不是塞进顶栏的输入框：
   顶栏两侧本来就贴着露头的乐队卡片，再挤一个会打架，窄屏尤其。 */
.search {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  padding: max(12vh, 60px) 20px 20px;
  background: color-mix(in srgb, var(--ground) 82%, transparent);
  backdrop-filter: blur(10px);
}
.search[hidden] { display: none; }

.search__panel {
  width: min(520px, 100%);
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 100%;
}

.search__input {
  width: 100%;
  font: inherit;
  font-size: 1.05rem;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 13px 16px;
  outline: none;
}
.search__input:focus { border-color: var(--ink-3); }
.search__input::placeholder { color: var(--ink-3); }

.search__results {
  list-style: none;
  margin: 0;
  padding: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.search__hit {
  display: flex;
  align-items: baseline;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 9px;
  padding: 9px 12px;
  cursor: pointer;
}
.search__hit:hover,
.search__hit[aria-selected='true'] { background: rgba(255, 255, 255, 0.07); }
.search__hit-name { font-weight: 600; font-size: 0.92rem; }
.search__hit-meta {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 0.66rem;
  color: var(--ink-3);
  white-space: nowrap;
}
.search__empty { padding: 10px 12px; font-size: 0.84rem; color: var(--ink-3); }

.legend {
  display: flex;
  flex-direction: column;
  gap: 2px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.legend__item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 0.63rem;
  color: var(--ink-3);
}
.legend__item i { width: 16px; height: 2px; background: var(--rel); border-radius: 2px; }
.legend__item.rel-feud i { background: repeating-linear-gradient(90deg, var(--rel) 0 5px, transparent 5px 8px); }
.legend__item.rel-scene i { background: repeating-linear-gradient(90deg, var(--rel) 0 2px, transparent 2px 5px); }

.status {
  margin: 0 0 0 auto;
  font-family: var(--mono);
  font-size: 0.63rem;
  color: var(--ink-3);
  text-align: right;
}

/* --------------------------------------------------------- 动画状态 */

/* 入场：连线画出来，边缘卡片再从屏幕外探进来 */
.is-entering .node--peek { --push: 64px; opacity: 0; }
.is-entering .node--chip { opacity: 0; }
.is-entering .node--focus .card--focus { opacity: 0; transform: translateY(10px); }
.node--focus .card--focus { transition: opacity 0.5s ease 0.05s, transform 0.5s cubic-bezier(0.2, 0.9, 0.25, 1) 0.05s; }
.node--chip { transition: opacity 0.4s ease 0.22s, transform 0.42s cubic-bezier(0.2, 0.9, 0.25, 1); }

.edge {
  stroke-dasharray: var(--len);
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 0.55s cubic-bezier(0.35, 0.9, 0.3, 1), opacity 0.25s ease, stroke-width 0.25s ease;
}
.is-entering .edge { stroke-dashoffset: var(--len); }
.rel-feud.edge, .rel-scene.edge { stroke-dasharray: 7 5; }
.rel-scene.edge { stroke-dasharray: 1.5 5; }
.is-entering .rel-feud.edge, .is-entering .rel-scene.edge { opacity: 0; }

/* 出发：除目标以外的一切先退场 */
.is-traveling .node--peek:not(.is-target),
.is-traveling .node--chip:not(.is-target),
.is-traveling .node--focus { opacity: 0; }
.is-traveling .edge { opacity: 0; }
.is-traveling .node--peek.is-target { --push: 0px; }
.is-traveling .relchip__detail { display: none; }

.card--peek.is-leaving { opacity: 0; position: absolute; inset: 0; pointer-events: none; }
.card--arriving { opacity: 0; }
.node--peek .card--focus { transition: opacity 0.45s ease 0.12s; }

.is-fading .world { opacity: 0; transition: opacity 0.2s ease; }

@media (prefers-reduced-motion: reduce) {
  .node, .edge, .card--focus, .node--chip, .card--peek.is-leaving, .node--peek .card--focus {
    transition-duration: 0.01ms !important;
  }
  .is-entering .node--peek { --push: 0px; opacity: 1; }
}

/* ------------------------------------------------------------- 窄屏 */

@media (max-width: 640px) {
    /* 窄屏只用上下两条边，同一条边上要并排放两张，所以卡片必须窄 */
  :root { --card-w: min(340px, 90vw); --peek-w: min(156px, 44vw); }
  .hud { padding: 12px 14px; }
  .status { font-size: 0.6rem; }
  .relchip { max-width: 190px; }
  /* 焦点卡片压矮，把上下两头的空间让给露头的邻居 */
  .card--focus { max-height: 52vh; padding: 18px 18px 14px; }
  .card--peek { padding: 12px; }
  .card--peek-n, .card--peek-s { height: 190px; }
  .peek__name { font-size: 0.9rem; }
  /* 副标题和图例都让位给卡片：关系类型每张卡片上本来就写着 */
  .wordmark__scene { display: none; }
  .legend { display: none; }
}

</style>

<main id="stage" class="stage" aria-label="乐队关系网"></main>

<header class="hud hud--top">
  <div class="wordmark">
    <span class="wordmark__name">乐队关系网</span>
    <span class="wordmark__scene" id="scene-name">载入中</span>
  </div>
  <button id="search-open" class="btn" type="button">搜索</button>
  <button id="shuffle" class="btn" type="button">换一支</button>
</header>

<div id="search" class="search" hidden>
  <div class="search__panel" role="dialog" aria-modal="true" aria-label="搜索乐队">
    <input id="search-input" class="search__input" type="search" autocomplete="off"
           placeholder="乐队名、地区…" aria-label="搜索乐队" aria-controls="search-results">
    <ul id="search-results" class="search__results" role="listbox"></ul>
  </div>
</div>

<footer class="hud hud--bottom">
  <ul class="legend" id="legend"></ul>
  <p class="status" id="status" role="status">载入中…</p>

async function loadIndex() {
  if (EMBEDDED) return EMBEDDED.index;
  const res = await fetch('data/index.json');
  if (!res.ok) throw new Error('索引加载失败');
  return res.json();
}

function loadBand(id) {
  if (EMBEDDED) {
    const doc = EMBEDDED.bands[id];
    return doc ? Promise.resolve(doc) : Promise.reject(new Error(`找不到乐队 ${id}`));
  }
  if (cache.has(id)) return Promise.resolve(cache.get(id));
  if (inflight.has(id)) return inflight.get(id);

  const p = fetch(`data/bands/${encodeURIComponent(id)}.json`)
    .then((res) => {
      if (!res.ok) throw new Error(`找不到乐队 ${id}`);
      return res.json();
    })
    .then((doc) => {
      cache.set(id, doc);
      inflight.delete(id);
      return doc;
    })
    .catch((err) => {
      inflight.delete(id);
      throw err;
    });

  inflight.set(id, p);
  return p;
}

function isLoaded(id) {
  return EMBEDDED ? id in EMBEDDED.bands : cache.has(id);

    for (const e of band.edges) {
      if (!cache.has(e.to)) loadBand(e.to).catch(() => {});
    }
  });
}

function el(tag, className, text) {
  const node = document.createElement(tag);

function metaLine(band) {
  return [band.area, band.years].filter(Boolean).join(' · ');
}

/** 焦点卡片：这支乐队的全部内容都在这里。 */
function buildFocusCard(band) {
  const card = el('article', 'card card--focus');
  card.dataset.id = band.id;

  const head = el('header', 'card__head');
  head.append(el('h1', 'card__name', band.name));
  head.append(el('p', 'card__meta', metaLine(band)));
  if (band.genres?.length) {
    const tags = el('ul', 'taglist');
    for (const g of band.genres) tags.append(el('li', 'tag', g));
    head.append(tags);
  }
  card.append(head);

  const body = el('div', 'card__body');

  if (band.intro) body.append(el('p', 'card__intro', band.intro));

  if (band.albums?.length) {
    const sec = section('代表作');
    const list = el('ol', 'albums');
    for (const a of band.albums) {
      const li = el('li', 'album');
      li.append(el('span', 'album__title', a.title));
      li.append(el('span', 'album__year', a.year ?? ''));
      list.append(li);
    }
    sec.append(list);
    body.append(sec);
  }

  if (band.tracks?.length) {
    const sec = section('代表曲');
    const list = el('ul', 'taglist taglist--tracks');
    for (const t of band.tracks) list.append(el('li', 'tag tag--track', t));
    sec.append(list);
    body.append(sec);
  }

  if (band.lore) {
    const sec = section('轶事');
    sec.append(el('p', 'lore', band.lore));
    body.append(sec);
  }

  // 全部关系都列在这里：屏幕边缘放不下的、以及触屏上没有悬停可用的，都从这里走。
  // 枢纽乐队能有几十条，一次全塞进 DOM 既重又读不完，截断到最相关的一批。
  const REL_LIMIT = 30;
  const listed = band.edges.slice(0, REL_LIMIT);
  const relSec = section(`全部关系 ${band.edges.length}`);
  const rels = el('ul', 'rels');
  for (const e of listed) {
    const li = el('li');
    const btn = el('button', `rel-row rel-${e.type}`);
    btn.type = 'button';
    btn.dataset.id = e.to;
    const top = el('span', 'rel-row__top');
    top.append(el('span', 'rel-row__dot'));
    top.append(el('span', 'rel-row__name', e.toName));
    top.append(el('span', 'rel-row__label', e.label + (e.year ? ` · ${e.year}` : '')));
    btn.append(top);
    if (e.detail) btn.append(el('span', 'rel-row__detail', e.detail));
    li.append(btn);
    rels.append(li);

  relSec.append(rels);
  if (band.edges.length > listed.length) {
    relSec.append(

  card.type = 'button';
  card.dataset.id = edge.to;
  card.setAttribute('aria-label', `前往 ${edge.toName}（${REL[edge.type].name}：${edge.label}）`);

  const inner = el('div', 'peek__inner');
  inner.append(el('span', 'peek__rel', REL[edge.type].short));
  inner.append(el('span', 'peek__name', edge.toName));
  inner.append(el('span', 'peek__meta', [edge.toArea, edge.toYears].filter(Boolean).join(' · ')));
  // 线上挂不下关系标签时（上下两边常常如此），由 placeChips 打开这一行顶上。
  inner.append(el('span', 'peek__label', edge.label + (edge.year ? ` · ${edge.year}` : '')));
  card.append(inner);
  return card;
}

/** 关系标签：贴在连线上，写清楚是谁、哪一年、什么事。 */
function buildRelChip(slot) {
  const { edge } = slot;
  const chip = el('div', `relchip rel-${edge.type}`);
  const head = el('span', 'relchip__head');
  head.append(el('span', 'relchip__dot'));
  head.append(document.createTextNode(edge.label));
  if (edge.year) head.append(el('span', 'relchip__year', String(edge.year)));
  chip.append(head);
  if (edge.detail) chip.append(el('span', 'relchip__detail', edge.detail));
  return chip;
}

function buildEdgeLayer() {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.classList.add('edges');
  svg.setAttribute('width', CANVAS_HALF * 2);
  svg.setAttribute('height', CANVAS_HALF * 2);
  svg.setAttribute('aria-hidden', 'true');
  svg.style.left = `${-CANVAS_HALF}px`;
  svg.style.top = `${-CANVAS_HALF}px`;
  return svg;
}

function buildEdgeLine(slot) {
  const line = document.createElementNS(SVG_NS, 'line');
  line.setAttribute('class', `edge rel-${slot.edge.type}`);
  line.setAttribute('x1', CANVAS_HALF);
  line.setAttribute('y1', CANVAS_HALF);
  line.setAttribute('x2', CANVAS_HALF + slot.x);
  line.setAttribute('y2', CANVAS_HALF + slot.y);
  const len = Math.hypot(slot.x, slot.y);
  line.style.setProperty('--len', len.toFixed(1));
  return line;
}





const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const sceneEl = document.getElementById('scene-name');

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const PAN_MS = 680;

let index = null;
let world = null;
let current = null; // 当前焦点乐队文档
let slots = []; // 当前邻居槽位
let busy = false;

/* ------------------------------------------------------------------ 相机 */

/**
 * 等到浏览器认下了元素的初始状态，再切到目标状态，动画才会跑起来。
 * 用 rAF 是正路，但后台标签页里 rAF 根本不触发——那样起始态就永远摘不掉，
 * 页面会停在「全部透明」的样子。所以再挂一个定时器兜底。
 */
function nextFrame(fn) {
  let done = false;
  const once = () => {
    if (done) return;
    done = true;
    fn();
  };
  requestAnimationFrame(() => requestAnimationFrame(once));
  setTimeout(once, 100);
}

function cameraTransform(x, y) {
  return `translate3d(${-x}px, ${-y}px, 0)`;
}

function panCamera(x, y) {
  if (reduceMotion.matches) {
    world.style.transform = cameraTransform(x, y);
    return Promise.resolve();
  }
  const anim = world.animate(
    [{ transform: cameraTransform(0, 0) }, { transform: cameraTransform(x, y) }],
    { duration: PAN_MS, easing: 'cubic-bezier(.72,0,.16,1)', fill: 'forwards' }
  );
  // 光等 finished 不行：标签页在后台时动画根本不推进，promise 永远不兑现，
  // 导航就会卡死在半路（busy 一直是 true，之后所有点击都被吞掉）。
  const bailout = new Promise((r) => setTimeout(r, PAN_MS + 150));
  return Promise.race([anim.finished.catch(() => {}), bailout]).then(() => {
    world.style.transform = cameraTransform(x, y);
    anim.cancel();
  });
}

/* ---------------------------------------------------------------- 渲染 */

function viewport() {
  return { vw: stage.clientWidth, vh: stage.clientHeight };
}

function makeNode(className, x, y, angle) {
  const node = document.createElement('div');
  node.className = `node ${className}`;
  node.style.left = `${x}px`;
  node.style.top = `${y}px`;
  if (angle != null) {
    node.style.setProperty('--ux', Math.cos(angle).toFixed(4));
    node.style.setProperty('--uy', Math.sin(angle).toFixed(4));
  }
  return node;
}

/**
 * 把世界整个重建一遍：焦点回到原点，相机归零。
 * 这一步永远发生在相机已经停在目标身上的时刻，画面内容一致，所以看不出偷换。
 */
function render(band, { cameFrom, backAngle, animate = true } = {}) {
  const { vw, vh } = viewport();
  laidOutFor = { vw, vh };
  slots = layoutNeighbors(band.id, band.edges, { cameFrom, backAngle, vw, vh });

  const next = document.createElement('div');
  next.className = 'world';
  next.style.transform = cameraTransform(0, 0);

  const edgeLayer = buildEdgeLayer();
  next.append(edgeLayer);

  const focusNode = makeNode('node--focus', 0, 0);
  focusNode.append(buildFocusCard(band));
  next.append(focusNode);

  for (const slot of slots) {
    edgeLayer.append(buildEdgeLine(slot));

    const chipNode = makeNode('node--chip', 0, 0);
    chipNode.append(buildRelChip(slot));
    next.append(chipNode);

    const node = makeNode('node--peek', slot.x, slot.y, slot.angle);
    node.append(buildPeekCard(slot));
    next.append(node);
    slot.node = node;
    slot.chip = chipNode;
  }

  if (world) world.remove();
  world = next;
  stage.append(world);
  placeChips(focusNode.firstElementChild);

  stage.classList.remove('is-traveling');
  current = band;

  if (animate && !reduceMotion.matches) {
    stage.classList.add('is-entering');
    nextFrame(() => stage.classList.remove('is-entering'));
  }

  document.title = `${band.name} · 乐队关系网`;
  setStatus(band);
  prefetchNeighbors(band);
}

/** 盒子在某个方向上的投影长度。 */
function projectSize(box, dx, dy) {
  return Math.abs(dx) * box.width + Math.abs(dy) * box.height;
}

const CHIP_CLEARANCE = 12;

/**
 * 关系标签贴在连线上，从焦点卡片的外缘往外挂。
 *
 * 挂而不是居中，是因为标签悬停时会多出一整句说明：从边缘往外长，
 * 长出去的部分落在空白里；居中的话两头都长，靠内那半截会钻到焦点卡片底下。
 *
 * 左右两条边够长，挂得下；上下两条边则不然——焦点卡片几乎顶到视口上下沿，
 * 和邻居卡片之间根本没有缝。那种情况就把标签收起来，改由邻居卡片自己写出关系。
 */
function placeChips(focusCard) {
  const focus = focusCard.getBoundingClientRect();

  for (const slot of slots) {
    const dx = Math.cos(slot.angle);
    const dy = Math.sin(slot.angle);

    const tx = Math.abs(dx) < 1e-6 ? Infinity : focus.width / 2 / Math.abs(dx);
    const ty = Math.abs(dy) < 1e-6 ? Infinity : focus.height / 2 / Math.abs(dy);
    const exit = Math.min(tx, ty); // 射线离开焦点卡片处
    const enter = slot.radius - projectSize(slot.node.getBoundingClientRect(), dx, dy) / 2;

    // 量展开后的尺寸：收起时放得下、一展开就撞车的位置，不如一开始就别放。
    slot.chip.classList.add('is-hot');
    const reach = projectSize(slot.chip.getBoundingClientRect(), dx, dy);
    slot.chip.classList.remove('is-hot');

    const d = exit + CHIP_CLEARANCE;
    if (d + reach > enter - CHIP_CLEARANCE) {
      slot.chip.hidden = true;
      slot.node.querySelector('.card--peek').classList.add('show-label');
      continue;
    }

    slot.chip.style.left = `${(dx * d).toFixed(1)}px`;
    slot.chip.style.top = `${(dy * d).toFixed(1)}px`;
    slot.chip.classList.add(
      Math.abs(dx) > 0.35 ? (dx > 0 ? 'anchor-e' : 'anchor-w') : dy > 0 ? 'anchor-s' : 'anchor-n'
    );
  }
}

function setStatus(band) {
  const shown = slots.length;
  const total = band.edges.length;
  if (total <= 1) {
    statusEl.textContent = `${band.name} 目前只有 ${total} 条关系 — 数据还很浅`;
  } else if (shown < total) {
    statusEl.textContent = `边缘显示 ${shown} / ${total} 条关系，其余在卡片内`;
  } else {
    statusEl.textContent = `${total} 条关系`;
  }
}

/* -------------------------------------------------------------- 导航 */

/** 点击边缘卡片：相机滑过去，目标在途中展开成新的焦点。 */
async function travelTo(slot) {
  if (busy) return;
  busy = true;
  try {
    const target = await loadBand(slot.edge.to);
    setRoute(target.id);

    stage.classList.add('is-traveling');
    slot.node.classList.add('is-target');
    slot.chip.classList.add('is-target');

    const peek = slot.node.querySelector('.card--peek');
    const arriving = buildFocusCard(target);
    arriving.classList.add('card--arriving');
    slot.node.append(arriving);
    peek.classList.add('is-leaving');
    nextFrame(() => arriving.classList.remove('card--arriving'));

    await panCamera(slot.x, slot.y);
    render(target, { cameFrom: current.id, backAngle: slot.angle + Math.PI });
  } catch (err) {
    console.error(err);
    statusEl.textContent = '加载失败，请重试';
    stage.classList.remove('is-traveling');
  } finally {
    busy = false;
  }
}

/** 没有来路方向时的跳转（随机、地址栏、卡片内的关系列表）：交叉淡入。 */
async function jumpTo(id, { push = true } = {}) {
  if (busy) return;
  busy = true;
  try {
    if (!isLoaded(id)) statusEl.textContent = '载入中…';
    const band = await loadBand(id);
    if (push) setRoute(band.id);
    stage.classList.add('is-fading');
    if (!reduceMotion.matches) await wait(220);
    render(band);
    stage.classList.remove('is-fading');
  } catch (err) {
    console.error(err);
    statusEl.textContent = '加载失败，请重试';
    stage.classList.remove('is-fading');
  } finally {
    busy = false;
  }
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/** 进站随机：只从关系够多的乐队里挑，避免一开局就是死胡同。 */
function randomId(exclude) {
  const pool = index.bands.filter((b) => b.degree >= 3 && b.id !== exclude);
  const from = pool.length ? pool : index.bands;
  return from[Math.floor(Math.random() * from.length)].id;
}

function idFromHash() {
  const m = location.hash.match(/^#\/band\/(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
}

/**
 * 地址栏同步是锦上添花：分享出去的链接能直达某支乐队。
 * 但沙箱里的 iframe 调 history API 会直接抛 SecurityError，
 * 不兜住的话整个导航都会跟着失败。
 */
function setRoute(id, { replace = false } = {}) {
  try {
    history[replace ? 'replaceState' : 'pushState'](null, '', `#/band/${id}`);
  } catch {
    /* 宿主不给写历史记录，那就不写，不影响走网 */
  }
}

/* -------------------------------------------------------------- 事件 */

stage.addEventListener('click', (ev) => {
  const peek = ev.target.closest('.card--peek');
  if (peek) {
    const slot = slots.find((s) => s.edge.to === peek.dataset.id);
    if (slot) travelTo(slot);
    return;
  }
  const row = ev.target.closest('.rel-row');
  if (row) {
    const slot = slots.find((s) => s.edge.to === row.dataset.id);
    if (slot) travelTo(slot);
    else jumpTo(row.dataset.id);
  }
});

// 悬停边缘卡片时，对应的连线与关系标签一起点亮。
stage.addEventListener('pointerover', (ev) => {
  const peek = ev.target.closest('.card--peek');
  if (peek) setHighlight(peek.dataset.id, true);
});
stage.addEventListener('pointerout', (ev) => {
  const peek = ev.target.closest('.card--peek');
  if (peek) setHighlight(peek.dataset.id, false);
});
stage.addEventListener('focusin', (ev) => {
  const peek = ev.target.closest('.card--peek');
  if (peek) setHighlight(peek.dataset.id, true);
});
stage.addEventListener('focusout', (ev) => {
  const peek = ev.target.closest('.card--peek');
  if (peek) setHighlight(peek.dataset.id, false);
});

function setHighlight(id, on) {
  const slot = slots.find((s) => s.edge.to === id);
  if (!slot) return;
  slot.node.classList.toggle('is-hot', on);
  slot.chip.classList.toggle('is-hot', on);
  world.querySelectorAll('.edge').forEach((line, i) => {
    if (slots[i] === slot) line.classList.toggle('is-hot', on);
  });
}

document.getElementById('shuffle').addEventListener('click', () => {
  jumpTo(randomId(current?.id));
});

/* -------------------------------------------------------------- 搜索 */

const searchEl = document.getElementById('search');
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let hits = [];
let cursor = 0;

function openSearch() {
  searchEl.hidden = false;
  searchInput.value = '';
  runSearch('');
  searchInput.focus();
}

function closeSearch() {
  searchEl.hidden = true;
}

/**
 * 名字前缀最优先，其次名字里包含，最后才是地区命中。
 * 输入为空时给几支关系最密的当入口，而不是空着一片。
 */
function runSearch(raw) {
  const q = raw.trim().toLowerCase();
  const pool = index?.bands ?? [];

  if (!q) {
    hits = [...pool].sort((a, b) => b.degree - a.degree).slice(0, 8);
  } else {
    hits = pool
      .map((b) => {
        const name = b.name.toLowerCase();
        if (name.startsWith(q)) return { b, rank: 0 };
        if (name.includes(q)) return { b, rank: 1 };
        if ((b.area ?? '').toLowerCase().includes(q)) return { b, rank: 2 };
        return null;
      })
      .filter(Boolean)
      .sort((x, y) => x.rank - y.rank || y.b.degree - x.b.degree)
      .slice(0, 12)
      .map((x) => x.b);
  }

  cursor = 0;
  searchResults.replaceChildren();
  if (!hits.length) {
    const li = document.createElement('li');
    li.className = 'search__empty';
    li.textContent = '没有找到这支乐队';
    searchResults.append(li);
    return;
  }
  hits.forEach((b, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'search__hit';
    btn.setAttribute('role', 'option');
    btn.setAttribute('aria-selected', String(i === cursor));
    btn.dataset.id = b.id;

    const name = document.createElement('span');
    name.className = 'search__hit-name';
    name.textContent = b.name;
    const meta = document.createElement('span');
    meta.className = 'search__hit-meta';
    meta.textContent = [b.area, `${b.degree} 条关系`].filter(Boolean).join(' · ');

    btn.append(name, meta);
    li.append(btn);
    searchResults.append(li);
  });
}

function moveCursor(delta) {
  if (!hits.length) return;
  cursor = (cursor + delta + hits.length) % hits.length;
  const options = searchResults.querySelectorAll('.search__hit');
  options.forEach((o, i) => o.setAttribute('aria-selected', String(i === cursor)));
  options[cursor]?.scrollIntoView({ block: 'nearest' });
}

document.getElementById('search-open').addEventListener('click', openSearch);
searchInput.addEventListener('input', () => runSearch(searchInput.value));

searchEl.addEventListener('click', (ev) => {
  // 点浮层的空白处关掉；点到结果就跳过去
  const hit = ev.target.closest('.search__hit');
  if (hit) {
    closeSearch();
    jumpTo(hit.dataset.id);
  } else if (!ev.target.closest('.search__panel')) {
    closeSearch();
  }
});

searchInput.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowDown') {
    ev.preventDefault();
    moveCursor(1);
  } else if (ev.key === 'ArrowUp') {
    ev.preventDefault();
    moveCursor(-1);
  } else if (ev.key === 'Enter' && hits[cursor]) {
    closeSearch();
    jumpTo(hits[cursor].id);
  }
});

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && !searchEl.hidden) return closeSearch();
  // 「/」是常见的搜索快捷键；正在输入的时候不抢
  if (ev.key === '/' && searchEl.hidden && !/^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) {
    ev.preventDefault();
    openSearch();
  }
});

window.addEventListener('hashchange', () => {
  const id = idFromHash();
  if (id && id !== current?.id) jumpTo(id, { push: false });
});

// 邻居的位置整个是按视口尺寸算出来的，尺寸一变就得重排。
// 用 ResizeObserver 而不是 window 的 resize 事件：舞台的尺寸变化未必伴随一次
// window resize（页面在隐藏的小画布里先渲染一遍就是这种情况），漏掉的话
// 邻居会按错误的尺寸摆在焦点卡片背后，一张都看不见。
let laidOutFor = { vw: 0, vh: 0 };
let resizeTimer;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const { vw, vh } = viewport();
    if (!current || busy) return;
    if (Math.abs(vw - laidOutFor.vw) < 24 && Math.abs(vh - laidOutFor.vh) < 24) return;
    render(current, { animate: false });
  }, 140);
}).observe(stage);

/* -------------------------------------------------------------- 启动 */

(async function boot() {
  try {
    index = await loadIndex();
    sceneEl.textContent = index.scene;
    const legend = document.getElementById('legend');
    for (const [type, meta] of Object.entries(REL)) {
      const li = document.createElement('li');
      li.className = `legend__item rel-${type}`;
      li.innerHTML = `<i></i>${meta.name}`;
      legend.append(li);
    }
    const id = idFromHash() ?? randomId();
    const band = await loadBand(id).catch(() => loadBand(randomId()));
    if (!idFromHash()) setRoute(band.id, { replace: true });
    render(band);
  } catch (err) {
    console.error(err);
    statusEl.textContent = '数据加载失败：请先运行 node tools/build-data.mjs';
  }
})();

})();
</script>
