<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>乐队关系网</title>
<meta name="description" content="从一支乐队出发，顺着成员、客串、影响与恩怨，走进整张关系网。">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="stage" class="stage" aria-label="乐队关系网"></main>

<header class="hud hud--top">
  <div class="wordmark">
    <span class="wordmark__name">乐队关系网</span>
    <span class="wordmark__scene" id="scene-name">载入中</span>
  </div>
  <button id="search-open" class="btn" type="button">搜索</button>
  <button id="shuffle" class="btn" type="button">换一支</button>
</header>

<section id="network-map" class="network-map" hidden aria-label="乐队关系全网地图">
  <canvas id="network-canvas"></canvas>
  <div class="network-map__hud"><button id="map-close" class="btn" type="button">返回卡片</button><span>双指缩放 · 拖动地图 · 点节点进入</span></div>
</section>

<div id="search" class="search" hidden>
  <div class="search__panel" role="dialog" aria-modal="true" aria-label="搜索乐队">
    <input id="search-input" class="search__input" type="search" autocomplete="off"
           placeholder="乐队名、地区…" aria-label="搜索乐队" aria-controls="search-results">
    <ul id="search-results" class="search__results" role="listbox"></ul>
  </div>
</div>

<footer class="hud hud--bottom">
  <ul class="legend" id="legend"></ul>
  <p class="status" id="status" role="status">载入中…</p>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
